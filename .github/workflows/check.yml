# أثر — فحص كل تعديل قبل نشره. Cloudflare ينشر فرع «live» فقط، ولا يصل التعديل إليه إلا إذا نجحت الفحوص.
# الفحص يعمل داخل صورة Playwright الجاهزة (فيها كروم وسفاري ومكتباتهما)، فلا يُنزَّل شيء ثقيل في كل مرة.
name: فحص ونشر
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: تثبيت أدوات الفحص
        timeout-minutes: 4
        run: npm i --no-save --no-package-lock adhan@4 playwright@1.56.0
      - name: index.html مبني من ملفات src
        run: python3 tools/build.py --check
      - name: المحتوى الديني والمواقيت والتنبيهات
        run: node tools/check.mjs
      - name: فتح الصفحات في كروم وسفاري
        env:
          SMOKE_BROWSERS: chromium,webkit
          HOME: /root
        run: node tools/smoke.mjs
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: النشر (نقل التعديل إلى فرع live)
        run: git push origin HEAD:refs/heads/live --force
